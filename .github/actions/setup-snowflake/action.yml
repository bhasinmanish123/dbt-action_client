# ============================================================
# COMPOSITE ACTION: setup-snowflake
# Lives in dbt-action_client repo (central actions)
#
# Usage from any project repo:
#   - uses: bhasinmanish123/dbt-action_client/.github/actions/setup-snowflake@main
#     with:
#       environment: ci          # or prod
#       snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
#
# What it does:
#   1. Installs Snowflake CLI
#   2. Fetches WIF OIDC token (github-script — Helia pattern)
#   3. Sets Snowflake env vars for the target environment
#   4. Applies caller overrides (optional)
#   5. Runs snow connection test to verify
# ============================================================
name: "Setup Snowflake (WIF OIDC)"
description: "Installs Snowflake CLI, fetches WIF OIDC token, sets connection env vars"

inputs:
  environment:
    description: "Target environment: ci or prod"
    required: true
  snowflake-account:
    description: "Snowflake account identifier"
    required: false
    default: ''
  snowflake-user:
    description: "Override Snowflake user (optional)"
    required: false
    default: ''
  snowflake-role:
    description: "Override Snowflake role (optional)"
    required: false
    default: ''
  snowflake-database:
    description: "Override Snowflake database (optional)"
    required: false
    default: ''
  snowflake-warehouse:
    description: "Override Snowflake warehouse (optional)"
    required: false
    default: ''
  python-version:
    description: "Python version for Snowflake CLI install"
    required: false
    default: '3.11'

runs:
  using: "composite"
  steps:

    # ---- Step 1: Install Snowflake CLI ----
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Snowflake CLI
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check pipx
        python -m pipx install snowflake-cli

    # ---- Step 2: Fetch WIF OIDC token ----
    - name: Obtain WIF OIDC token
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken('snowflakecomputing.com');
          core.setSecret(token);
          core.exportVariable('SNOWFLAKE_TOKEN', token);
          core.exportVariable('SNOWFLAKE_AUTHENTICATOR', 'WORKLOAD_IDENTITY');
          core.exportVariable('SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER', 'OIDC');
          core.info('WIF OIDC token obtained and masked successfully');

    # ---- Step 3: Set env vars per environment ----
    - name: Set Snowflake connection for environment
      shell: bash
      run: |
        echo "SNOWFLAKE_ACCOUNT=${{ inputs.snowflake-account }}" >> $GITHUB_ENV

        case "${{ inputs.environment }}" in
          "ci")
            echo "SNOWFLAKE_USER=GITHUB_ACTIONS_SERVICE_USER"  >> $GITHUB_ENV
            echo "SNOWFLAKE_ROLE=DBT_CI_ROLE"                  >> $GITHUB_ENV
            echo "SNOWFLAKE_DATABASE=AIRBNB"                   >> $GITHUB_ENV
            echo "SNOWFLAKE_WAREHOUSE=COMPUTE_WH"              >> $GITHUB_ENV
            echo "SNOWFLAKE_SCHEMA=CI"                         >> $GITHUB_ENV
            ;;
          "prod")
            echo "SNOWFLAKE_USER=GITHUB_ACTIONS_SERVICE_USER"  >> $GITHUB_ENV
            echo "SNOWFLAKE_ROLE=DBT_PROD_ROLE"                >> $GITHUB_ENV
            echo "SNOWFLAKE_DATABASE=AIRBNB"                   >> $GITHUB_ENV
            echo "SNOWFLAKE_WAREHOUSE=COMPUTE_WH"              >> $GITHUB_ENV
            echo "SNOWFLAKE_SCHEMA=PROD"                       >> $GITHUB_ENV
            ;;
          *)
            echo "::error::Invalid environment '${{ inputs.environment }}'. Must be: ci or prod"
            exit 1
            ;;
        esac

    # ---- Step 4: Apply caller overrides ----
    - name: Apply overrides
      shell: bash
      run: |
        if [[ -n "${{ inputs.snowflake-user }}"      ]]; then echo "SNOWFLAKE_USER=${{ inputs.snowflake-user }}"           >> $GITHUB_ENV; fi
        if [[ -n "${{ inputs.snowflake-role }}"      ]]; then echo "SNOWFLAKE_ROLE=${{ inputs.snowflake-role }}"           >> $GITHUB_ENV; fi
        if [[ -n "${{ inputs.snowflake-database }}"  ]]; then echo "SNOWFLAKE_DATABASE=${{ inputs.snowflake-database }}"   >> $GITHUB_ENV; fi
        if [[ -n "${{ inputs.snowflake-warehouse }}" ]]; then echo "SNOWFLAKE_WAREHOUSE=${{ inputs.snowflake-warehouse }}" >> $GITHUB_ENV; fi

    # ---- Step 5: Verify connection ----
    - name: Test Snowflake connection
      shell: bash
      env:
        SNOWFLAKE_ACCOUNT: ${{ inputs.snowflake-account }}
      run: snow connection test -x
